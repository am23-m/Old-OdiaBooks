<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Library Page</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="library.css">
</head>

<body>

  <!-- LIBRARY PAGE WRAPPER -->
  <div class="library-page">

    <h1>📚 My Library</h1>

    <input type="text" placeholder="Search books..." class="search-box">

    <div class="library-container">

      <div class="book-card">
        <h3>Chha Mana Atha Guntha</h3></h3>
        <p>Fakir Mohan</p>
        <button>Open</button>
      </div>

      <div class="book-card">
        <h3>Odia Barnabodha</h3>
        <p>Classic</p>
        <button>Open</button>
      </div>

      <div class="book-card">
        <h3>History</h3>
        <p>     Odia & Literature</p>
        <button>Open</button>
      </div>

    </div>

    <div class="video-section">
      <h2>📺 Video Lecture</h2>

      <iframe width="100%" height="220"
  src="https://www.youtube.com/embed/RZLT71QLnH8"
  frameborder="0"
  allowfullscreen>
</iframe>

    </div>

  </div>

</body>
</html>
